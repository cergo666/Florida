name: Florida

on:
  schedule:
    - cron: "0 9/12 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "ci"]
    paths:
      - ".github/workflows/build.yml"
      - "patches/**"
      - "scripts/**"
      - "tests/**"
      - "install.py"
      - "README.md"

env:
  NDK_VERSION: r29

jobs:
  check_version:
    runs-on: ubuntu-22.04

    outputs:
      FRIDA_VERSION: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
      ALREADY_RELEASE: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE }}

    steps:
      - name: Pull Frida Latest Release
        id: pullFridaLatestRelease
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: 'frida',
              repo: 'frida',
            });
            core.setOutput('FRIDA_VERSION', release.data.tag_name);

      - name: Split Repository Name
        id: split_name
        run: |
          IFS='/' read -ra parts <<< "${{ github.repository }}"
          echo "owner=${parts[0]}" >> $GITHUB_OUTPUT
          echo "repo=${parts[1]}" >> $GITHUB_OUTPUT

      - name: Check release version
        id: checkReleaseVersion
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = '${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}';
            const owner = '${{ steps.split_name.outputs.owner }}';
            const repo = '${{ steps.split_name.outputs.repo }}';
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const manual = '${{ github.event_name }}' === 'push' ||
                             '${{ github.event_name }}' === 'workflow_dispatch';
              core.setOutput('ALREADY_RELEASE', manual ? '2' : '1');
            } catch (e) {
              if (e.status === 404) {
                core.setOutput('ALREADY_RELEASE', '0');
              } else {
                core.setFailed(e.message);
              }
            }

      - name: Delete existing release (if re-running)
        if: ${{ steps.checkReleaseVersion.outputs.ALREADY_RELEASE == '2' }}
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: ${{ steps.pullFridaLatestRelease.outputs.FRIDA_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify rewrite anchors against upstream Frida
        run: |
          git clone --depth 1 https://github.com/frida/frida.git frida-src
          git -C frida-src submodule update --init --depth 1 subprojects/frida-core subprojects/frida-gum
          python3 scripts/rewrite.py --frida-dir frida-src --check --seed ci

  create_release:
    needs: [check_version, test]
    runs-on: ubuntu-22.04
    if: needs.check_version.outputs.ALREADY_RELEASE != '1'

    steps:
      - uses: softprops/action-gh-release@v2.1.0
        id: createRelease
        with:
          tag_name: ${{ needs.check_version.outputs.FRIDA_VERSION }}
          name: ${{ needs.check_version.outputs.FRIDA_VERSION }}
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  android_build:
    needs: [check_version, create_release, test]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [android-arm, android-arm64, android-x86, android-x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          local-cache: false
          link-to-sdk: true

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev \
            flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev \
            python3-pip libc6-dev libc6-dev-i386
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install graphlib

      - name: Build frida for ${{ matrix.arch }}
        shell: bash
        run: |
          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          python3 scripts/identities.py --seed "${{ github.run_id }}-${{ needs.check_version.outputs.FRIDA_VERSION }}" -o identities.json
          git clone --recurse-submodules https://github.com/frida/frida
          python3 scripts/rewrite.py --frida-dir frida --identities identities.json
          mkdir "build-${{ matrix.arch }}"
          cd "build-${{ matrix.arch }}"
          ../frida/configure --host=${{ matrix.arch }}
          make -j"$(nproc)"

      - name: Scan binaries for classic fingerprints
        run: |
          python3 scripts/scan_binary.py \
            "build-${{ matrix.arch }}/subprojects/frida-core/server/frida-server" \
            "build-${{ matrix.arch }}/subprojects/frida-core/lib/gadget/frida-gadget.so" \
            "build-${{ matrix.arch }}/subprojects/frida-core/inject/frida-inject"

      - name: Package artifacts
        run: |
          gzip -f "build-${{ matrix.arch }}/subprojects/frida-core/server/frida-server"
          gzip -f "build-${{ matrix.arch }}/subprojects/frida-core/inject/frida-inject"
          gzip -f "build-${{ matrix.arch }}/subprojects/frida-core/lib/gadget/frida-gadget.so"
          gzip -f "build-${{ matrix.arch }}/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a"

      - name: Stage artifacts with release names
        env:
          FRIDA_VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
        run: |
          mkdir -p staging
          a="${{ matrix.arch }}"
          cp "build-$a/subprojects/frida-core/server/frida-server.gz" \
             "staging/florida-server-$FRIDA_VERSION-$a.gz"
          cp "build-$a/subprojects/frida-core/inject/frida-inject.gz" \
             "staging/florida-inject-$FRIDA_VERSION-$a.gz"
          cp "build-$a/subprojects/frida-core/lib/gadget/frida-gadget.so.gz" \
             "staging/florida-gadget-$FRIDA_VERSION-$a.so.gz"
          cp "build-$a/subprojects/frida-gum/bindings/gumjs/libfrida-gumjs-1.0.a.gz" \
             "staging/florida-gumjs-$FRIDA_VERSION-$a.a.gz"
          cp identities.json "staging/florida-identities-$FRIDA_VERSION.json"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error

  upload_assets:
    needs: [check_version, create_release, android_build]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRIDA_VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
        run: |
          gh release upload "$FRIDA_VERSION" ./*.gz florida-identities-*.json --clobber
